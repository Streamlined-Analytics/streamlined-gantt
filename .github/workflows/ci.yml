name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx prettier --check .
      - name: SPDX headers
        run: npm run check:spdx
      - name: Events reference is generated from the catalogue
        run: node scripts/generate-events-doc.mjs --check

  typecheck:
    name: Type check (JSDoc) and declarations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:types

  engine:
    name: Engine tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          - Europe/London
          - America/Los_Angeles
          - Pacific/Auckland
          - Pacific/Kiritimati
          - Australia/Lord_Howe
          - America/Sao_Paulo
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Engine unit and property tests with coverage floors
        if: matrix.tz == 'Europe/London'
        run: npm run test:coverage
        env:
          TZ: ${{ matrix.tz }}
          SG_FC_RUNS: "1000"
      - name: Engine unit and property tests
        if: matrix.tz != 'Europe/London'
        run: npm test
        env:
          TZ: ${{ matrix.tz }}
          SG_FC_RUNS: "1000"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.tz == 'Europe/London'
        with:
          name: engine-coverage
          path: coverage
          retention-days: 7

  dom:
    name: Browser component tests (Vitest, Chromium)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dom

  build:
    name: Build, licence banner and size budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Licence banner and NOTICE present
        run: npm run check:banner
      - name: Bundle size budget
        run: npm run check:size | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Declarations work for a TypeScript consumer
        run: npx tsc -p tests/types/tsconfig.json
      - name: Pack smoke (file list, publint, attw, no runtime dependencies)
        run: npm run check:pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Browser tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium + Pixel touch
            browser: chromium
            projects: --project=chromium --project=pixel
          - name: webkit + iPad and iPhone touch
            browser: webkit
            projects: --project=webkit --project=ipad --project=iphone
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npx playwright test ${{ matrix.projects }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  visual:
    name: Visual regression (pinned Playwright container)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27 # v1.63.0-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run build
      - run: npx playwright test -c playwright.visual.config.js
        env:
          HOME: /root
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  burn-in:
    name: Burn-in of changed browser tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Repeat changed specs ten times with no retries
        run: npx playwright test --project=chromium --only-changed=origin/${{ github.base_ref }} --repeat-each=10 --retries=0
