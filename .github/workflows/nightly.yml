name: Nightly

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions: {}

env:
  NODE_VERSION: "22"

jobs:
  engine-properties:
    name: Engine properties, 10k runs (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz:
          - Europe/London
          - America/Los_Angeles
          - Pacific/Auckland
          - Pacific/Kiritimati
          - Australia/Lord_Howe
          - America/Sao_Paulo
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Properties at 10,000 runs (failing seeds and paths are printed for replay)
        run: npm test
        env:
          TZ: ${{ matrix.tz }}
          SG_FC_RUNS: "10000"

  dom-all-browsers:
    name: Browser component tests (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:dom
        env:
          SG_NIGHTLY: "1"

  e2e-full:
    name: Browser tests, full matrix (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.browser }}
        env:
          SG_NIGHTLY: "1"

  typescript-7-compat:
    name: TypeScript 7 compatibility (non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx --yes typescript@7.0.2 -p tsconfig.json --noEmit

  mspdi-mpxj-samples:
    name: MSPDI import of MPXJ sample files (pinned, checksummed)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MPXJ_SHA: 7ccc95353be81028e074e8b1ce634add8716dd0c
      SG_MPXJ_DIR: ${{ github.workspace }}/.mpxj
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fetch MPXJ samples (LGPL, so fetched at test time and never committed; ADR-0008)
        run: |
          mkdir -p "$SG_MPXJ_DIR"
          base="https://raw.githubusercontent.com/joniles/mpxj/$MPXJ_SHA/junit/data/generated"
          curl -fsSL "$base/task-links/task-links-project2019-mspdi.xml" -o "$SG_MPXJ_DIR/task-links.xml"
          curl -fsSL "$base/task-text/task-text-project2019-mspdi.xml" -o "$SG_MPXJ_DIR/task-text.xml"
          curl -fsSL "$base/calendar-recurring-exceptions/calendar-recurring-exceptions-project2016-mspdi.xml" -o "$SG_MPXJ_DIR/recurring.xml"
          cd "$SG_MPXJ_DIR"
          sha256sum --check <<'SUMS'
          c1c38e9187c2433e968d1d8b4989a844d629e518e728816a19a9ec0bac287532  recurring.xml
          0f62aee93bf52df56b0726151b7e9cfa973fe9f2fcf77b89f52e6dbe81bc7c2d  task-links.xml
          0a5224a0a0e289735781ce42460f653a57e13c5d6bd7ab7a76c20de1e01340ea  task-text.xml
          SUMS
      - run: npx vitest run --config vitest.engine.config.js tests/io/mpxj.nightly.test.js

  performance:
    name: Performance budgets (1,000 tasks, 1,500 links)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Engine benchmarks (tinybench)
        run: node tests/perf/schedule.bench.js | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Browser budgets (render, scroll, drag, reschedule)
        run: npx playwright test --project=chromium tests/perf | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          SG_PERF: "1"
