name: Weekly

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions: {}

env:
  NODE_VERSION: "22"

jobs:
  mutation:
    name: Mutation testing (Stryker, engine and IO)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx stryker run --concurrency 4
        env:
          SG_FC_RUNS: "200"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 30

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Runtime dependencies (must be none)
        run: node -e 'const p=require("./package.json"); if (Object.keys(p.dependencies||{}).length || Object.keys(p.peerDependencies||{}).length) { console.error("Runtime dependencies are not allowed"); process.exit(1); }'
      - name: Development dependency advisories (informational)
        run: npm audit --audit-level=high || true
