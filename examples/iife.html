<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Script-tag build · streamlined-gantt</title>
    <link rel="stylesheet" href="/dist/streamlined-gantt.css" />
    <link rel="stylesheet" href="/examples/examples.css" />
    <script src="/dist/streamlined-gantt.iife.min.js"></script>
  </head>
  <body>
    <main>
      <h1>Script-tag build</h1>
      <p>No bundler: one script tag registers the element, and the data comes from a URL.</p>
      <streamlined-gantt
        id="job"
        src="/examples/data/flat-roof.json"
        zoom="week"
        height="420px"
      ></streamlined-gantt>
    </main>
  </body>
