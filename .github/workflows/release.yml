name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  NODE_VERSION: "22"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm CLI with trusted publishing (11.5.1 or later)
        run: npm install -g npm@11.20.0
      - run: npm ci
      - name: Tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Pack smoke (file list, publint, attw, no runtime dependencies)
        run: npm run check:pack
      # Staged: goes live only after a maintainer approves it on npmjs.com (ADR-0017).
      - run: npm stage publish --provenance
